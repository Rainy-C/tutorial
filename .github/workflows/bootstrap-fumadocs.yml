name: Bootstrap Fumadocs Migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Commit migrated Markdown and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/docs pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare Fumadocs content and lockfile"
            git push origin HEAD:main
          fi
