name: Audit Internal Links

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Crawl every internal link
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Crawl all tutorial pages and internal hrefs
        run: python3 scripts/audit_links.py
