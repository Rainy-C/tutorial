name: Audit Internal Links

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Crawl every internal link
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Crawl all tutorial pages and internal hrefs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import time
          from collections import defaultdict, deque
          from html.parser import HTMLParser
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote, urljoin, urlsplit, urlunsplit, urldefrag
          from urllib.request import Request, urlopen

          BASE = "https://rainy-c.github.io/tutorial/"
          HOST = "rainy-c.github.io"

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "a":
                      return
                  for k, v in attrs:
                      if k.lower() == "href" and v:
                        self.hrefs.append(v)

          def canonical(url):
              url, _ = urldefrag(url)
              p = urlsplit(url)
              path = quote(p.path or "/", safe="/:@-._~!$&'()*+,;=%")
              return urlunsplit((p.scheme.lower(), p.netloc.lower(), path, "", ""))

          def seed_urls():
              yield BASE, "<homepage>"
              root = "content/docs"
              for dirpath, _, files in os.walk(root):
                  for name in sorted(files):
                      if not (name.endswith(".md") or name.endswith(".mdx")):
                          continue
                    full = os.path.join(dirpath, name)
                    rel = os.path.relpath(full, root).replace(os.sep, "/")
                    rel = rel[:-4] if rel.endswith(".mdx") else rel[:-3]
                    enc = "/".join(quote(part, safe="-._~|") for part in rel.split("/"))
                    yield canonical(BASE + enc + "/"), rel

          queue = deque()
          refs = defaultdict(set)
          discovered = set()
          for url, label in seed_urls():
              u = canonical(url)
              if u not in discovered:
                  discovered.add(u)
                  queue.append(u)
              refs[u].add(label)

          results = {}
          html_pages = 0
          hrefs_parsed = 0
          same_host_hrefs = 0

          while queue:
              url = queue.popleft()
              code = 0
              body = b""
              ctype = ""
              final = url

              for attempt in range(4):
                  try:
                      req = Request(url, headers={"User-Agent": "Rainy-C/tutorial-link-audit"})
                      with urlopen(req, timeout=30) as r:
                          code = r.getcode() or 0
                        final = canonical(r.geturl())
                        ctype = r.headers.get("Content-Type", "")
                        body = r.read()
                      break
                  except HTTPError as e:
                      code = e.code
                      final = canonical(e.geturl() or url)
                      try:
                          body = e.read()
                      except Exception:
                          body = b""
                      ctype = e.headers.get("Content-Type", "") if e.headers else ""
                      break
                  except Exception as e:
                      if attempt == 3:
                          code = 0
                          body = repr(e).encode()
                      else:
                          time.sleep(1 + attempt)

              results[url] = code
              if not (200 <= code < 300) or "text/html" not in ctype.lower():
                  continue

              html_pages += 1
              parser = Links()
              try:
                  parser.feed(body.decode("utf-8", errors="replace"))
              except Exception:
                  pass

              for href in parser.hrefs: 
                  hrefs_parsed += 1
                  raw = href.strip()
                  low = raw.lower()
                  if not raw or low.startswith(("#", "mailto:", "tel:", "javascript:", "data:")):
                      continue
                  target = canonical(urljoin(final, raw))
                  p = urlsplit(target)
                  if p.scheme not in ("http", "https") or p.netloc.lower() != HOST:
                      continue
                  same_host_hrefs += 1
                  refs[target].add(url)
                  if target not in discovered:
                      discovered.add(target)
                      queue.append(target)

          bad = sorted((u, c) for u, c in results.items() if not (200 <= c < 300))

          print("===== INTERNAL LINK AUDIT =====")
          print("Seed URLs: 153")
          print(f"HTML pages crawled: {html_pages}")
          print(f"Anchor hrefs parsed: {hrefs_parsed}")
          print(f"Same-host hrefs discovered: {same_host_hrefs}")
          print(f"Unique same-host URLs requested: {len(results)}")
          print(f"Broken/non-2xx URLs: {len(bad)}")

          if bad:
              print("\n===== BROKEN URLS =====")
              for url, code in bad:
                  print(f"[{code or 'ERR'}] {url}")
                  for ref in sorted(refs[url]):
                      print(f"    <- {ref}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("## Internal link audit\n\n")
                  f.write(f"- Unique URLs checked: **{len(results)}**\n")
                  f.write(f"- Broken/non-2xx: **{len(bad)}**\n\n")
                  f.write("### Broken URLs\n\n")
                  for url, code in bad:
                      f.write(f"- `{code or 'ERR'}` {url}\n")
                      for ref in sorted(refs[url]):
                          f.write(f"  - from: {ref}\n")
              sys.exit(1)

          print("\nNo broken same-host links found.")
          PY
