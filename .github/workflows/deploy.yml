name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Verify all tutorial routes were exported
        shell: bash
        run: |
          set -euo pipefail
          expected=0
          missing=0

          while IFS= read -r -d '' file; do
            expected=$((expected + 1))
            rel="${file#content/docs/}"
            rel="${rel%.md}"
            rel="${rel%.mdx}"
            target="out/${rel}/index.html"

            if [[ ! -f "$target" ]]; then
              echo "::error title=Missing exported tutorial route::$target"
              missing=$((missing + 1))
            fi
          done < <(find content/docs -type f \( -name '*.md' -o -name '*.mdx' \) -print0)

          echo "Tutorial source files: $expected"
          echo "Missing exported routes: $missing"
          [[ "$expected" -eq 152 ]]
          [[ "$missing" -eq 0 ]]

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-online:
    name: Crawl every internal link
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Crawl all tutorial pages and internal hrefs
        run: python3 scripts/audit_links.py
